    <meta name="description" content="Capture short video clips throughout your day. Memcut compiles your daily clips into a seamless story with live speech-to-text transcription." />
    <title>Memcut — Daily Video Journal</title>
    <script>
      // Defensive guard against third-party toolbar instrumentation (e.g. Vercel Toolbar focus-trap / tabbable crawler)
      // which calls Array.from on undefined shadowRoot / media child collections
      (function() {
        if (typeof Array !== 'undefined' && Array.from) {
          var _origFrom = Array.from;
          Array.from = function(items, mapFn, thisArg) {
            if (items === undefined || items === null) {
              return [];
            }
            return _origFrom.apply(this, arguments);
          };
        }
        window.addEventListener('error', function(event) {
          if (event && event.filename && event.filename.indexOf('instrument') !== -1 && event.message && event.message.indexOf('not iterable') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
